name: Deploy ENSUC para DirectAdmin

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  build-and-deploy:
    name: Build Astro & Enviar via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm ci || npm install

      - name: 🚀 Compilar site estático (Astro)
        run: npm run build

      - name: 📤 Sincronizar com DirectAdmin (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false
