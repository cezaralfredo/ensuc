<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Página não encontrada — ENSUC</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--deep:#060e09;--forest:#0d1f15;--gold:#c9a84c;--gold2:#e8c55a;--white:#f4f0e8;--gray:#8a9e8f;--border:rgba(201,168,76,0.18);--fd:'Playfair Display',Georgia,serif;--fa:'Oswald',sans-serif;--fb:'DM Sans',system-ui,sans-serif;}
body{background:var(--deep);color:var(--white);font-family:var(--fb);font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.code{font-family:var(--fa);font-size:clamp(6rem,15vw,12rem);font-weight:600;color:rgba(201,168,76,0.12);line-height:1;user-select:none;}
h1{font-family:var(--fd);font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;margin:1rem 0;line-height:1.2;}
h1 em{font-style:italic;color:var(--gold);}
p{color:var(--gray);max-width:480px;margin:0 auto 2rem;line-height:1.7;font-size:.95rem;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--deep);font-family:var(--fa);font-size:.85rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:14px 28px;border-radius:2px;text-decoration:none;transition:all .3s ease;}
.btn:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(201,168,76,.35);}
</style>
</head>
<body>
<div class="code">404</div>
<h1>Página <em>não encontrada.</em></h1>
<p>O endereço que você procura não existe ou foi movido. Use o botão abaixo para voltar ao início e explorar o mercado de carbono com a ENSUC.</p>
<a href="/" class="btn">Voltar ao Início →</a>
</body>
</html>
